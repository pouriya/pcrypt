name: Docker Build & Push

on:
  push:
    tags:
      - '**'

permissions:
  contents: read
  packages: write   # Needed to push to ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: |
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: make docker

      - name: Tag images for registry
        run: |
          docker tag pcrypt:latest ghcr.io/${{ github.repository_owner }}/pcrypt:latest
          docker tag pcrypt:${{ steps.version.outputs.version }} ghcr.io/${{ github.repository_owner }}/pcrypt:${{ steps.version.outputs.version }}
          if [ -n "${{ github.ref_name }}" ]; then
            docker tag pcrypt:latest ghcr.io/${{ github.repository_owner }}/pcrypt:${{ github.ref_name }}
          fi

      - name: Push images to registry
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pcrypt:latest
          docker push ghcr.io/${{ github.repository_owner }}/pcrypt:${{ steps.version.outputs.version }}
          if [ -n "${{ github.ref_name }}" ]; then
            docker push ghcr.io/${{ github.repository_owner }}/pcrypt:${{ github.ref_name }}
          fi
